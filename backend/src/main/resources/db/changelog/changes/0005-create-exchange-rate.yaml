databaseChangeLog:
  - changeSet:
      id: 0005-create-exchange-rate
      author: stock-market-analyzer
      comment: >-
        User-supplied conversion factors between two units (USD -> HUF, OZ -> HUF, ...) as of a
        date. One rate per owner, pair and date; wealth values are computed from the newest rate
        on or before the entry's date.
      changes:
        - createTable:
            tableName: exchange_rate
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_exchange_rate
                    nullable: false
              - column:
                  name: owner_sub
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: source_unit
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: destination_unit
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: rate
                  type: NUMERIC(24, 8)
                  constraints:
                    nullable: false
              - column:
                  name: rate_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: exchange_rate
            columnNames: owner_sub, source_unit, destination_unit, rate_date
            constraintName: uq_exchange_rate_owner_pair_date
        - createIndex:
            tableName: exchange_rate
            indexName: ix_exchange_rate_lookup
            columns:
              - column:
                  name: owner_sub
              - column:
                  name: source_unit
              - column:
                  name: destination_unit
              - column:
                  name: rate_date
                  descending: true
      rollback:
        - dropTable:
            tableName: exchange_rate
