databaseChangeLog:
  - changeSet:
      id: 0008-create-dividend
      author: stock-market-analyzer
      comment: >-
        A dividend the owner actually received: an amount of some unit, paid on a date, against
        an instrument. Scoped per Keycloak subject like wealth_entry -- what you were paid is
        your data, not the installation's. Nothing about worth is stored; the amount is valued
        on read from the owner's own exchange rates, exactly as wealth entries are.
      changes:
        - createTable:
            tableName: dividend
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_dividend
                    nullable: false
              - column:
                  name: owner_sub
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: instrument_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(24, 6)
                  constraints:
                    nullable: false
              - column:
                  name: unit
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: payment_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        # RESTRICT, not CASCADE: price_bar is market data that can be refetched, whereas a
        # dividend is something the owner typed in. Deleting an instrument someone has been
        # paid by is refused rather than quietly taking their history with it.
        - addForeignKeyConstraint:
            baseTableName: dividend
            baseColumnNames: instrument_id
            referencedTableName: instrument
            referencedColumnNames: id
            constraintName: fk_dividend_instrument
            onDelete: RESTRICT
        - createIndex:
            tableName: dividend
            indexName: ix_dividend_owner_payment_date_desc
            columns:
              - column:
                  name: owner_sub
              - column:
                  name: payment_date
                  descending: true
        - createIndex:
            tableName: dividend
            indexName: ix_dividend_instrument
            columns:
              - column:
                  name: instrument_id
      rollback:
        - dropTable:
            tableName: dividend
