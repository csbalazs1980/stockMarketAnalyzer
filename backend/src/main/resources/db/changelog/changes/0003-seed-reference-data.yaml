databaseChangeLog:
  - changeSet:
      id: 0003-seed-reference-data
      author: stock-market-analyzer
      context: dev-data
      comment: A handful of well known instruments, loaded only under the dev-data context.
      changes:
        - insert:
            tableName: instrument
            columns:
              - column: { name: symbol, value: AAPL }
              - column: { name: name, value: Apple Inc. }
              - column: { name: exchange, value: NASDAQ }
              - column: { name: currency, value: USD }
              - column: { name: asset_type, value: STOCK }
              - column: { name: sector, value: Technology }
              - column: { name: active, valueBoolean: true }
        - insert:
            tableName: instrument
            columns:
              - column: { name: symbol, value: MSFT }
              - column: { name: name, value: Microsoft Corporation }
              - column: { name: exchange, value: NASDAQ }
              - column: { name: currency, value: USD }
              - column: { name: asset_type, value: STOCK }
              - column: { name: sector, value: Technology }
              - column: { name: active, valueBoolean: true }
        - insert:
            tableName: instrument
            columns:
              - column: { name: symbol, value: SPY }
              - column: { name: name, value: SPDR S&P 500 ETF Trust }
              - column: { name: exchange, value: NYSEARCA }
              - column: { name: currency, value: USD }
              - column: { name: asset_type, value: ETF }
              - column: { name: sector, value: Broad Market }
              - column: { name: active, valueBoolean: true }
      rollback:
        - delete:
            tableName: instrument
            where: symbol in ('AAPL', 'MSFT', 'SPY')
