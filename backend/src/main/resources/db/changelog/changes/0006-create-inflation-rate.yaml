databaseChangeLog:
  - changeSet:
      id: 0006-create-inflation-rate
      author: stock-market-analyzer
      comment: >-
        Annual inflation per currency, as a percentage (4.6 means 4.6%; negative means
        deflation). Shared reference data -- a published statistic is the same fact for every
        user -- so unlike wealth_entry and exchange_rate there is no owner column.
      changes:
        - createTable:
            tableName: inflation_rate
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_inflation_rate
                    nullable: false
              - column:
                  name: unit
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: rate
                  type: NUMERIC(9, 4)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: inflation_rate
            columnNames: unit, year
            constraintName: uq_inflation_rate_unit_year
        - createIndex:
            tableName: inflation_rate
            indexName: ix_inflation_rate_unit_year
            columns:
              - column:
                  name: unit
              - column:
                  name: year
                  descending: true
      rollback:
        - dropTable:
            tableName: inflation_rate
