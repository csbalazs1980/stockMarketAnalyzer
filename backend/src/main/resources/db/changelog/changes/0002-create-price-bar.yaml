databaseChangeLog:
  - changeSet:
      id: 0002-create-price-bar
      author: stock-market-analyzer
      comment: Daily OHLCV bars, one row per instrument per trading day.
      changes:
        - createTable:
            tableName: price_bar
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_price_bar
                    nullable: false
              - column:
                  name: instrument_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: trade_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: open_price
                  type: NUMERIC(19, 6)
                  constraints:
                    nullable: false
              - column:
                  name: high_price
                  type: NUMERIC(19, 6)
                  constraints:
                    nullable: false
              - column:
                  name: low_price
                  type: NUMERIC(19, 6)
                  constraints:
                    nullable: false
              - column:
                  name: close_price
                  type: NUMERIC(19, 6)
                  constraints:
                    nullable: false
              - column:
                  name: adjusted_close
                  type: NUMERIC(19, 6)
              - column:
                  name: volume
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: price_bar
            baseColumnNames: instrument_id
            referencedTableName: instrument
            referencedColumnNames: id
            constraintName: fk_price_bar_instrument
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: price_bar
            columnNames: instrument_id, trade_date
            constraintName: uq_price_bar_instrument_date
        - createIndex:
            tableName: price_bar
            indexName: ix_price_bar_instrument_date_desc
            columns:
              - column:
                  name: instrument_id
              - column:
                  name: trade_date
                  descending: true
      rollback:
        - dropTable:
            tableName: price_bar
