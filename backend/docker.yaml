name: stock-market-analyzer

services:
  postgres:
    image: postgres:18-alpine
    container_name: sma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockmarket}
      POSTGRES_USER: ${POSTGRES_USER:-stockmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmarket}
      # Deterministic collation so ORDER BY is stable across host platforms.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images store the cluster in a major-version-specific directory
      # (PGDATA=/var/lib/postgresql/18/docker) and declare the volume one level up. Mounting
      # the old /var/lib/postgresql/data path leaves the named volume unused -- the data would
      # land in an anonymous volume instead -- which the 18 entrypoint now refuses to start on.
      # See docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockmarket} -d ${POSTGRES_DB:-stockmarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Keycloak shares the application's Postgres *server* but gets its own role and its own
  # database, so its ~100 tables never mix with the Liquibase-managed application schema.
  #
  # This runs as a one-shot job rather than a /docker-entrypoint-initdb.d script on purpose:
  # init scripts only fire when the data volume is created, so on an existing sma-postgres-data
  # volume they would silently never run. The SQL below is idempotent and cheap to re-run, so
  # it works on a fresh volume and on an existing one alike.
  keycloak-db-init:
    image: postgres:18-alpine
    container_name: sma-keycloak-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-stockmarket}
      PGPASSWORD: ${POSTGRES_PASSWORD:-stockmarket}
      PGDATABASE: ${POSTGRES_DB:-stockmarket}
      KC_DB_NAME: ${KEYCLOAK_DB:-keycloak}
      KC_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASS: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "ensuring role \"$$KC_DB_USER\" and database \"$$KC_DB_NAME\" exist"
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$$KC_DB_USER'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE ROLE \"$$KC_DB_USER\" LOGIN PASSWORD '$$KC_DB_PASS'"
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = '$$KC_DB_NAME'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$KC_DB_NAME\" OWNER \"$$KC_DB_USER\""
        echo "keycloak database ready"

  # Upstream community Keycloak from Quay -- no registry login required.
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.6}
    container_name: sma-keycloak
    restart: unless-stopped
    # start-dev is deliberate: it relaxes hostname/HTTPS rules for local work.
    # Production uses `start` plus KC_HOSTNAME and real TLS.
    command: ["start-dev", "--import-realm"]
    environment:
      # Bootstrap account for the master-realm admin console. Renamed from KEYCLOAK_ADMIN
      # in Keycloak 26 -- the old names are silently ignored.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      # Same Postgres container as the application, separate database.
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
      # Management port: /health/ready, /health/live, /metrics
      - "${KEYCLOAK_MGMT_PORT:-9000}:9000"
    volumes:
      - ./docker/keycloak/realm-stockmarket.json:/opt/keycloak/data/import/realm-stockmarket.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      # The Keycloak image ships no curl or wget, so probe the management port with bash's
      # /dev/tcp. Health lives on 9000, not on the HTTP port, since Keycloak 25.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Optional web UI for poking at the database: docker compose --profile tools up -d
  adminer:
    image: adminer:5
    container_name: sma-adminer
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  postgres-data:
    name: sma-postgres-data
